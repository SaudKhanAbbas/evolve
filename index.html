<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EVOLVE — an interactive evolution simulator. Watch life emerge."
    />
    <title>EVOLVE</title>
  </head>
  <body>
    <div id="app-shell">
      <aside id="hud-panel" aria-label="Simulation statistics">
        <header class="panel-header">
          <h1>EVOLVE</h1>
          <div class="status-line">
            <span id="status-dot" class="dot"></span>
            <span id="status-text">LIVE</span>
          </div>
        </header>

        <section class="panel-section">
          <div class="section-label">ECOSYSTEM</div>
          <div id="hud" aria-live="off">
            <div class="stat-row">
              <span class="stat-label">POPULATION</span
              ><span class="stat-value" data-stat="population">—</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">GENERATION</span
              ><span class="stat-value" data-stat="generation">—</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">TIME</span><span class="stat-value" data-stat="time">—</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">SPEED</span
              ><span class="stat-value" data-stat="speed">—</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">SEED</span><span class="stat-value" data-stat="seed">—</span>
            </div>
          </div>
        </section>

        <section class="panel-section">
          <div class="chart-block">
            <div class="chart-label">
              <span>POPULATION</span><span id="chart-pop-value" class="chart-value">—</span>
            </div>
            <canvas id="chart-pop"></canvas>
          </div>
          <div class="chart-block">
            <div class="chart-label">
              <span>AVG SPEED GENE</span><span id="chart-speed-value" class="chart-value">—</span>
            </div>
            <canvas id="chart-speed"></canvas>
          </div>
        </section>
      </aside>

      <main id="viewport">
        <canvas id="app"></canvas>
        <div id="controls">
          <button id="play-pause" class="ctrl-btn primary" title="Toggle pause (Space)">
            PAUSE
          </button>
          <div id="speed-group" role="group" aria-label="Simulation speed">
            <button class="ctrl-btn speed" data-speed="0.25">0.25×</button>
            <button class="ctrl-btn speed" data-speed="0.5">0.5×</button>
            <button class="ctrl-btn speed active" data-speed="1">1×</button>
            <button class="ctrl-btn speed" data-speed="2">2×</button>
            <button class="ctrl-btn speed" data-speed="5">5×</button>
            <button class="ctrl-btn speed" data-speed="10">10×</button>
          </div>
        </div>
      </main>

      <aside id="inspector" aria-label="Creature inspector"></aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
